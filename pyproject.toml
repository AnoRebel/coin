[project]
name = "arne"
version = "0.1.0"
description = "AnorebelNetwork (ARNE) reference Python full node"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cbor2>=6.1.5",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "py-ecc>=8.0.0",
    "pydantic>=2.14.1",
    "segno>=1.6.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
arne = "arne.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/arne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
